<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单的诗词首页</title>
    <style>
        /* 基础样式，让页面更美观 */
        body {
            font-family: "微软雅黑", SimHei, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            line-height: 1.8;
            color: #333;
            background-color: #f8f9fa;
        }
        .title {
            text-align: center;
            color: #2c3e50;
        }
        .poem {
            margin-top: 30px;
            font-size: 18px;
            text-align: center;
            white-space: pre-line; /* 保留换行 */
        }
    </style>
</head>
<body>
    <h1 class="title">生活偶记</h1>
    <p style="text-align: center;">平凡日子里，藏着温柔与诗意</p>
    
    <div class="poem">
        山居秋暝
        【唐】王维

        空山新雨后，天气晚来秋。
        明月松间照，清泉石上流。
        竹喧归浣女，莲动下渔舟。
        随意春芳歇，王孙自可留。
    </div>
</body>
</html>
